[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-velocity"
version = "2.0.0"
description = "A fast note-taking app for the UNIX terminal"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Sean Hammond" },
    { name = "Vincent Perricone" },
]
requires-python = ">=3.11"
dependencies = ["textual>=8"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_velocity"]

[project.urls]
Homepage = "https://github.com/vhp/terminal_velocity"

[project.scripts]
terminal-velocity = "terminal_velocity.cli:main"
terminal_velocity = "terminal_velocity.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
